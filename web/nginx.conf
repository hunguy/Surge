server {
  listen 1777;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Vite fingerprints everything under /assets, so those are safe to pin forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # nginx's stock mime.types has no entry for .webmanifest, and Chrome ignores a
  # manifest served as octet-stream, so Add to Home Screen never offers install.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
